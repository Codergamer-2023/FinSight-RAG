services:

  backend:
    image: finsight-backend:latest
    container_name: finsight-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data/qdrant:/app/data/qdrant
      - ./data/uploads:/app/data/uploads
    restart: unless-stopped

  frontend:
    image: finsight-frontend:latest
    container_name: finsight-frontend
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://backend:8000/api/v1
    depends_on:
      - backend
    restart: unless-stopped
    